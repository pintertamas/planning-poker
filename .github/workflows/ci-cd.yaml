name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Code Quality & Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Frontend build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH != '' && vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - name: Frontend size budget
        run: npm run size -w frontend

  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-24.04
    needs:
      - test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Validate Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "${CLOUDFLARE_API_TOKEN}" ] || (echo "Missing secret: CLOUDFLARE_API_TOKEN" && exit 1)
          [ -n "${CLOUDFLARE_ACCOUNT_ID}" ] || (echo "Missing secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: worker
          command: deploy
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-frontend:
    name: Deploy Frontend (GitHub Pages)
    runs-on: ubuntu-24.04
    needs:
      - test
      - deploy-worker
    if: ${{ !cancelled() && needs.test.result == 'success' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH != '' && vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_WS_BASE_URL: ${{ needs.deploy-worker.outputs.url || vars.VITE_WS_BASE_URL }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
          include-hidden-files: "true"

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
